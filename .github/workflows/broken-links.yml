name: Check for broken links

on:
  push:
    branches:
      - main
    paths:
      - "_pages/**"
      - "_projects/**"
      - "_news/**"
      - "_bibliography/**"
      - ".lycheeignore"
      - ".github/workflows/broken-links.yml"
  pull_request:
    branches:
      - main
    paths:
      - "_pages/**"
      - "_projects/**"
      - "_news/**"
      - "_bibliography/**"
      - ".lycheeignore"
      - ".github/workflows/broken-links.yml"
  schedule:
    - cron: "0 6 * * 1" # jeden Montag 06:00 UTC – findet Links, die von selbst sterben
  workflow_dispatch: # Start per Hand unter Actions → "Check for broken links" → "Run workflow"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # Geprüft werden nur deine Inhalte (Seiten, Projekte, News, Bibliographie),
          # nicht die Doku-Dateien des Themes (FAQ.md, CUSTOMIZE.md, ...).
          # Nur http(s)-Links: interne Links wie /publications/ oder ../digital-twins/
          # kann lychee in den Quelldateien nicht auflösen; die prüft schon
          # "Check for broken links on site" auf der gebauten Seite.
          args: >-
            --scheme https --scheme http
            --user-agent 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
            --cookie-jar cookies.json
            --accept '100..=103,200..=299,429'
            --max-concurrency 8
            --max-retries 3
            --retry-wait-time 5
            --timeout 30
            --exclude-path '_pages/404.md'
            --no-progress
            './_pages/**/*.md'
            './_projects/**/*.md'
            './_news/**/*.md'
            './_bibliography/*.bib'
